name: Release APK

# Publishes a release when release notes for the current versionName land on a branch.
# The tag (v<versionName>) is created by the release step; an existing release is left alone.
on:
  push:
    branches: [ main, "claude/**" ]
    paths: [ ".github/release-notes/**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="v$(sed -n 's/.*versionName *= *"\(.*\)".*/\1/p' app/build.gradle.kts | head -1)"
          echo "tag=$v" >> "$GITHUB_OUTPUT"
          test -f ".github/release-notes/$v.md" || { echo "No notes for $v"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; }
          if gh release view "$v" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi

      - name: Set up JDK 21
        if: steps.version.outputs.skip != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK licenses
        if: steps.version.outputs.skip != 'true'
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle
        if: steps.version.outputs.skip != 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        if: steps.version.outputs.skip != 'true'
        run: ./gradlew --stacktrace assembleDebug testDebugUnitTest

      - name: Name the APK after the tag
        if: steps.version.outputs.skip != 'true'
        run: cp app/build/outputs/apk/debug/app-debug.apk "hanita-${{ steps.version.outputs.tag }}.apk"

      - name: Publish GitHub release
        if: steps.version.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Hanita ${{ steps.version.outputs.tag }}
          body_path: .github/release-notes/${{ steps.version.outputs.tag }}.md
          files: hanita-${{ steps.version.outputs.tag }}.apk
