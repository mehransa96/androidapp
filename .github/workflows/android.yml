name: Android CI

on:
  push:
    branches: [ main, master, "claude/**" ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # The ubuntu-latest runner already ships the Android SDK (ANDROID_HOME);
      # AGP downloads any missing platform/build-tools automatically.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK and run unit tests
        run: ./gradlew --stacktrace assembleDebug testDebugUnitTest

      - name: Build release (minified, unsigned)
        run: ./gradlew --stacktrace assembleRelease

      - name: Android Lint
        run: ./gradlew --stacktrace lintDebug

      - name: Print lint findings
        if: always()
        run: cat app/build/reports/lint-results.txt || true

      - name: Print Room schema
        if: always()
        run: find app/schemas -name '*.json' -exec sh -c 'echo "=== $1"; cat "$1"' _ {} \; || true

      - name: Upload lint report and Room schemas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-and-schemas
          path: |
            app/build/reports/lint-results-debug.*
            app/schemas/
          if-no-files-found: ignore

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: hanita-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
